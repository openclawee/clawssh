##
## Nginx TLS terminator for ClawSSH WebSocket proxy
##
## Usage:
## 1) Place this file under /etc/nginx/conf.d/clawssh-wsproxy.conf
## 2) Adjust server_name and certificate paths
## 3) Ensure clawssh-wsproxy listens on 127.0.0.1:8443 (TLS/WSS backend)
## 4) nginx -t && systemctl reload nginx
##

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream clawssh_wsproxy_upstream {
    server 127.0.0.1:8443 max_fails=3 fail_timeout=10s;
    keepalive 512;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ssh.example.com;

    ssl_certificate     /etc/letsencrypt/live/ssh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssh.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers on;

    # Optional hardening headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Health endpoint (plain HTTP response from backend).
    location = /healthz {
        proxy_pass https://clawssh_wsproxy_upstream/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # WebSocket tunnel endpoint.
    location /ws {
        proxy_pass https://clawssh_wsproxy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long-lived SSH sessions.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        send_timeout 24h;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }
}
